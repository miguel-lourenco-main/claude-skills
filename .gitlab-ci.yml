# GitLab Pages — publish the marketplace HUB at the root + the UI Reference Gallery
# SHELL under /gallery/ (both static, no data). The hub (site/) is the front door:
# it lists every plugin from .claude-plugin/marketplace.json and launches the ones
# with a UI. The gallery vault is intentionally NOT shipped — the hosted gallery lets
# each visitor load their own vault folder in the browser. No build, no Node, no LFS.
pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - site/**/*
        - ui-ux-references/gallery/src/**/*
        - .claude-plugin/marketplace.json
        - .gitlab-ci.yml
  script:
    - mkdir -p public
    - cp -r site/. public/                                  # hub / index at the root
    - mkdir -p public/gallery
    - cp -r ui-ux-references/gallery/src/. public/gallery/   # gallery served from /gallery/
    - cp .claude-plugin/marketplace.json public/marketplace.json  # data source for the hub
  artifacts:
    paths:
      - public
  environment:
    name: pages

# Auto-deploy the Prospector app to Fly.io on commits to the default branch that
# touch plugins/prospector. Requires the CI/CD variable FLY_API_TOKEN — a Fly deploy
# token (`flyctl tokens create deploy -a prospector-leadgen`) set as PROTECTED
# (the token contains a space, so GitLab can't mask it; protected limits it to the
# protected default branch, which is where this job runs). flyctl reads it from the env.
deploy_prospector:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - plugins/prospector/**/*
  script:
    - apk add --no-cache curl
    - curl -L https://fly.io/install.sh | sh
    - export FLYCTL_INSTALL="/root/.fly"; export PATH="$FLYCTL_INSTALL/bin:$PATH"
    - cd plugins/prospector
    - flyctl deploy --remote-only -a prospector-leadgen
  environment:
    name: prospector-production
    url: https://prospector-leadgen.fly.dev
