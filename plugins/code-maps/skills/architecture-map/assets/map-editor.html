<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A drafting sheet: the boxes on the left, one drawing in the middle, the facts behind whatever is
   selected on the right. The same page is the viewer (data embedded) and the editor (files dropped in). */
:root {
  --bg: #EEF1F1; --panel: #FBFCFC; --sunk: #E3E8E8; --rule: #CBD5D5;
  --fg: #121A1B; --fg-2: #3F5053; --muted: #64777A;
  --accent: #0B5D5E; --accent-soft: #D5E8E7;
  --changed: #8A5A00; --changed-soft: #FBEBC8;
  --gap: #8E2B34; --gap-soft: #F6E1E2;
  --actor: #C7581A; --actor-soft: #F7E3D6; --person: #1E2A2B;
  --g-box: #FDFEFE; --g-line: #55666A; --g-faint: #B5C1C2; --g-frame: #C3CECF; --g-pkg: #E6EBEB; --g-band: #E7ECEC;
  --h-class: #DCE5F5; --h-iface: #CFE6E4; --h-data: #F6E9CB; --h-comp: #D5E8E7; --h-pkg: #E6EBEB; --h-stack: #DDE3E4; --h-own: #EEF1F1;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1314; --panel: #141C1D; --sunk: #0A0F10; --rule: #2A383A; --fg: #E6EEEE; --fg-2: #B3C3C4; --muted: #8A9C9E;
  --accent: #5EC4C1; --accent-soft: #143536; --changed: #F0C063; --changed-soft: #3A2C0C; --gap: #F09AA2; --gap-soft: #3A1A1E;
  --actor: #F0955A; --actor-soft: #3E2415; --person: #DCE6E6;
  --g-box: #182122; --g-line: #93A5A8; --g-faint: #3D4C4F; --g-frame: #344446; --g-pkg: #111A1B; --g-band: #121A1B;
  --h-class: #24344F; --h-iface: #17403F; --h-data: #47391A; --h-comp: #17403F; --h-pkg: #1C2627; --h-stack: #263133; --h-own: #1A2324;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1314; --panel: #141C1D; --sunk: #0A0F10; --rule: #2A383A; --fg: #E6EEEE; --fg-2: #B3C3C4; --muted: #8A9C9E;
  --accent: #5EC4C1; --accent-soft: #143536; --changed: #F0C063; --changed-soft: #3A2C0C; --gap: #F09AA2; --gap-soft: #3A1A1E;
  --actor: #F0955A; --actor-soft: #3E2415; --person: #DCE6E6;
  --g-box: #182122; --g-line: #93A5A8; --g-faint: #3D4C4F; --g-frame: #344446; --g-pkg: #111A1B; --g-band: #121A1B;
  --h-class: #24344F; --h-iface: #17403F; --h-data: #47391A; --h-comp: #17403F; --h-pkg: #1C2627; --h-stack: #263133; --h-own: #1A2324;
  color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); margin: 0; display: flex; flex-direction: column }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
code, .mono { font-family: var(--mono) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 9px 16px; border-bottom: 1px solid var(--rule) }
header h1 { font-size: 17px; font-weight: 700; margin: 0 }
header .facts { color: var(--muted); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere }
header .right { margin-left: auto; display: flex; gap: 6px; align-items: center }
header .tiers { display: flex; gap: 2px; font: 500 12px var(--sans) }
header .tiers a, header .tiers span { padding: 2px 8px; border: 1px solid var(--rule); border-radius: 4px; color: var(--fg-2); text-decoration: none }
header .tiers span { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600 }
header .tiers a:hover { border-color: var(--accent) }
header .search { position: relative; flex: 0 1 260px }
#q { width: 100%; padding: 4px 9px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px }
#hits { position: absolute; z-index: 6; top: 100%; right: 0; left: 0; margin-top: 2px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; max-height: 50vh; overflow: auto; box-shadow: 0 6px 18px rgb(0 0 0 / .14) }
#hits button { display: block; width: 100%; text-align: left; padding: 5px 9px; background: none; border: 0 }
#hits button:hover, #hits button:focus-visible { background: var(--sunk) }
#hits small { color: var(--muted); font-family: var(--mono); font-size: 11px; display: block }
main { flex: 1; min-height: 0; display: grid; --nav-w: 224px; --side-w: 380px; grid-template-columns: var(--nav-w) 6px minmax(0, 1fr) 6px var(--side-w) }
main.solo { grid-template-columns: var(--nav-w) 6px minmax(0, 1fr) 0 0 }
main.nonav { grid-template-columns: 0 0 minmax(0, 1fr) 6px var(--side-w) }
main.nonav.solo { grid-template-columns: 0 0 minmax(0, 1fr) 0 0 }
main > nav { grid-column: 1 } main > #sp1 { grid-column: 2 } main > section { grid-column: 3 } main > #sp2 { grid-column: 4 } main > aside { grid-column: 5 }
main.nonav nav, main.nonav #sp1, main.solo aside, main.solo #sp2 { display: none }
.split { cursor: col-resize; background: var(--rule); background-clip: content-box; padding: 0 2px; transition: background .12s }
.split:hover, .split.on { background: var(--accent); background-clip: content-box }
nav, aside { overflow: auto; background: var(--panel); font-size: 13px }
nav { border-right: 1px solid var(--rule); padding: 8px 0 }
aside { border-left: 1px solid var(--rule); padding: 14px 16px 40px; overflow-wrap: anywhere; position: relative; min-width: 0 }
nav .lt { font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 12px 14px 3px; display: flex; gap: 6px; align-items: center }
nav .lt .tools { margin-left: auto; display: none; gap: 2px }
body.edit nav .lt .tools { display: flex }
nav .lt .tools button { background: none; border: 0; padding: 0 3px; color: var(--muted) }
nav ul { list-style: none; margin: 0; padding: 0 }
nav ul ul { padding-left: 14px }
nav li > div { display: flex; align-items: baseline; gap: 4px; padding: 2px 10px 2px 8px; border-left: 3px solid transparent }
nav li > div:hover { background: var(--sunk) }
nav li > div.sel { border-left-color: var(--accent); background: var(--accent-soft) }
nav .tw { width: 16px; flex: none; background: none; border: 0; padding: 0; color: var(--muted); font-family: var(--mono) }
nav .nm { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: 500 12.5px var(--mono); overflow-wrap: anywhere }
nav .nm.g { font: 600 12.5px var(--sans) }
nav .nm.planned, nav .nm.actor { color: var(--muted); font-style: italic }
nav .n { font: 500 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
section { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative }
.bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--rule) }
.crumbs { font: 500 13px var(--mono); min-width: 0; overflow-wrap: anywhere }
.crumbs b { font: 700 14px var(--sans); margin-right: 8px }
.grp { display: flex; gap: 2px }
.grp button, #banner button { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.grp button:disabled { opacity: .35; cursor: default }
.grp button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600 }
.grp.right { margin-left: auto }
.ic { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; flex: none }
#banner { padding: 7px 16px; border-bottom: 1px solid var(--rule); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
#banner.warn { background: var(--changed-soft); color: var(--changed) }
#banner.fail { background: var(--gap-soft); color: var(--gap) }
#banner[hidden] { display: none }
#stage { flex: 1; min-height: 0; overflow: auto; padding: 18px; cursor: grab; touch-action: none; overscroll-behavior: contain; position: relative }
#stage.drag { cursor: grabbing; user-select: none }
#stage svg { display: block }
#sheet { display: inline-block; box-sizing: content-box; vertical-align: top }
#stage .fail, #stage .wait { color: var(--gap); max-width: 60ch; padding: 20px }
#stage .wait { color: var(--muted) }
#status { padding: 5px 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap }
#status b { color: var(--fg-2); font-weight: 600 }
#status .dev { margin-left: auto; opacity: .6 }
#status .bad { color: var(--gap); font-weight: 600 }
#legend { position: absolute; z-index: 5; right: 16px; top: 48px; width: min(560px, calc(100% - 32px)); max-height: calc(100% - 100px); overflow: auto; padding: 12px 16px 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); font-size: 12.5px; color: var(--fg-2); box-shadow: 0 8px 24px rgb(0 0 0 / .16) }
#legend p { margin: 4px 0 8px; max-width: 90ch }
.legend { display: grid; grid-template-columns: 58px 1fr 58px 1fr; gap: 5px 10px; align-items: center }
.legend svg { width: 56px; height: 14px; overflow: visible }
.legend .sw { display: inline-block; width: 44px; height: 14px; border: 1px solid var(--g-line); border-radius: 3px }
#legend .x, aside .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted) }
/* the drawing */
#stage svg text { font-family: var(--mono); fill: var(--fg-2); font-size: 11.5px }
#stage svg text.t { font-weight: 600; font-size: 12.5px; fill: var(--fg) }
#stage svg text.t.it { font-style: italic }
#stage svg text.st { font-size: 10px; fill: var(--muted) }
#stage svg text.m { font-size: 11px }
#stage svg text.el { font: 500 11px var(--sans); fill: var(--muted) }
#stage svg text.band { font: 600 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; fill: var(--muted) }
#stage svg rect.band { fill: var(--g-band); stroke: none }
#stage svg rect.elbg { fill: var(--bg) }
g.node { cursor: pointer }
body.edit #stage g.node, body.edit #stage g.grp rect.ghead { cursor: move }
g.node rect.box { fill: var(--g-box) }
g.node rect.line { fill: none; stroke: var(--g-line); stroke-width: 1 }
g.node line.sep { stroke: var(--g-line); stroke-width: 1 }
g.node rect.head { stroke: none }
g.node.k-class rect.head { fill: var(--h-class) }
g.node.k-interface rect.head, g.node.k-annotation rect.head { fill: var(--h-iface) }
g.node.k-record rect.head, g.node.k-enum rect.head { fill: var(--h-data) }
g.node.k-stack rect.head { fill: var(--h-stack) }
g.node.k-stack rect.line { stroke-dasharray: 5 4 }
g.node.k-stack rect.shadow { fill: var(--g-box); stroke: var(--g-line); stroke-dasharray: 5 4 }
g.node.k-own rect.head { fill: var(--h-own) }
g.node.k-component rect.head { fill: var(--h-comp) }
g.node.k-package rect.head { fill: var(--h-pkg) }
g.node.k-component rect.line, g.node.k-package rect.line { stroke-width: 1.4 }
g.node.k-component g.hd, g.node.k-package g.hd { cursor: pointer }
g.node.alias rect.line { stroke-dasharray: 4 3; stroke: var(--accent) }
g.node.alias rect.head { fill: var(--accent-soft) }
g.node.planned { opacity: .55 }
g.node.legacy rect.head { fill: var(--sunk) } g.node.legacy text.t { fill: var(--fg-2) } g.node.legacy rect.line { stroke-dasharray: 2 3 }
g.edge.faint path.ln { stroke: var(--g-faint) !important; stroke-dasharray: 2 3 }
#stage.lens g.edge:not(.near) { opacity: .12 }
#stage.quiet-arrows:not(.lens):not(.lit) g.edge { opacity: .07 }
#stage.lens g.node:not(.near), #stage.lens g.grp:not(.near) { opacity: .55 }
g.node.planned rect.line { stroke-dasharray: 6 4 }
g.node.k-actor rect.sys { fill: var(--actor); stroke: none }
g.node.k-actor text.t.sys { fill: #fff }
g.node.k-actor rect.person { fill: #1E2A2B; stroke: var(--person) }
#stage svg g.node.k-actor text.t.person { fill: #fff }
g.node.k-actor path.gl.person { stroke: #fff }
g.node.k-actor .store { fill: var(--actor-soft); stroke: var(--actor); stroke-width: 1.4 }
g.node.k-actor path.gl { stroke: #fff }
g.node.sel rect.line, g.node.sel rect.sys, g.node.sel rect.person, g.node.sel .store { stroke: var(--accent); stroke-width: 2.5 }
g.node.moving, g.grp.moving { opacity: .7 }
g.grp rect.frame { fill: var(--g-pkg); stroke: var(--g-frame); stroke-width: 1.2 }
g.grp.k-package rect.frame { stroke-dasharray: 0 }
g.grp rect.ghead { fill: var(--h-comp); stroke: none; cursor: pointer }
g.grp.quiet rect.frame { stroke-dasharray: 3 3; fill: none }
g.grp.k-package rect.ghead { fill: var(--h-pkg) }
g.grp text.gt { font: 600 12.5px var(--sans); fill: var(--fg) }
g.grp text.gs { font-size: 10.5px; fill: var(--muted) }
g.grp.sel rect.frame { stroke: var(--accent); stroke-width: 2.5 }
g.grp path.gl, g.node path.gl { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
g.edge path.ln { fill: none; stroke: var(--g-line); stroke-width: 1.3 }
g.edge path.hit { fill: none; stroke: transparent; stroke-width: 12px }
g.edge { cursor: pointer }
g.edge.k-extends path.ln, g.edge.k-implements path.ln { stroke: var(--fg); stroke-width: 1.4 }
g.edge.k-implements path.ln { stroke-dasharray: 6 4 }
g.edge.k-field path.ln { stroke: var(--accent); stroke-width: 1.5 }
g.edge.k-dep path.ln, g.edge.k-weak path.ln { stroke-dasharray: 4 3 }
g.edge.k-weak path.ln { stroke: var(--g-faint) }
g.edge.mutual path.ln { stroke: var(--changed) }
g.edge.k-declared path.ln { stroke: var(--actor); stroke-width: 1.5; stroke-dasharray: 8 3 2 3 }
g.edge.agg path.ln { stroke-width: 1.8 }
g.edge.sel path.ln, g.edge:hover path.ln { stroke-width: 2.8 }
marker path { fill: var(--g-line); stroke: none }
marker.tri path { fill: var(--g-box); stroke: var(--fg); stroke-width: 1.2 }
marker.open path { fill: none; stroke: var(--g-line); stroke-width: 1.4 }
marker.open.f path { stroke: var(--accent) }
marker.open.a path { stroke: var(--actor) }
marker.open.mu path { stroke: var(--changed) }
#stage.lit g.node:not(.on), #stage.lit g.edge:not(.on), #stage.lit g.grp:not(.on) { opacity: .2 }
g.node, g.edge, g.grp { transition: opacity .12s }
/* the facts */
aside h2 { font-size: 16px; margin: 0 0 2px; font-weight: 700; line-height: 1.25 }
aside .kind { font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
aside p { margin: 7px 0; color: var(--fg-2); max-width: 62ch }
aside p.lead { font-size: 14.5px; line-height: 1.5; padding: 9px 11px; border-radius: 5px; background: var(--accent-soft); color: var(--fg); border-left: 3px solid var(--accent); margin: 8px 0 10px }
aside h3 { font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; padding: 6px 8px 6px 10px; border-left: 3px solid var(--accent); background: var(--sunk); border-radius: 0 4px 4px 0; display: flex; gap: 7px; align-items: center }
aside h3 .ic { color: var(--accent); width: 15px; height: 15px }
aside h3 .n { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; white-space: nowrap }
aside h3 { flex-wrap: wrap }
aside .badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 }
aside .badge { font: 500 11.5px var(--mono); padding: 2px 7px; border: 1px solid var(--rule); border-radius: 4px; color: var(--fg-2); display: inline-flex; gap: 4px; align-items: center }
aside .badge .ic { width: 12px; height: 12px }
aside .badge.on { border-color: var(--accent); color: var(--accent) }
aside blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--sunk) }
aside .loc { font: 11.5px var(--mono); color: var(--muted) }
aside table { border-collapse: collapse; font: 11.5px var(--mono); width: 100% }
aside td, aside th { padding: 3px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; text-align: left }
aside td.f { white-space: nowrap; color: var(--fg) }
aside td.v, aside td.ln { color: var(--fg-2) }
aside .scroll { overflow: auto; max-width: 100% }
aside .members { font: 11.5px var(--mono); line-height: 1.6 }
aside ul.rel { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column }
aside ul.rel li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 1px 8px; padding: 8px 0 8px 8px; border-left: 3px solid var(--g-faint); border-bottom: 1px solid var(--rule); font-size: 12.5px }
aside ul.rel li.r-field { border-left-color: var(--accent) }
aside ul.rel li.r-extends, aside ul.rel li.r-implements { border-left-color: var(--fg) }
aside ul.rel li.r-declared { border-left-color: var(--actor) }
aside ul.rel li.r-weak { border-left-color: var(--g-faint); border-left-style: dashed }
aside ul.rel li.off { opacity: .65 }
aside ul.rel .dir { display: flex; align-items: center; padding-top: 2px; color: var(--muted) }
aside ul.rel li.out .dir { color: var(--accent) } aside ul.rel li.in .dir { color: var(--changed) }
aside ul.rel .jump { background: none; border: 0; padding: 0; font: 600 12.5px var(--mono); color: var(--accent); text-align: left }
aside ul.rel .how { color: var(--fg); font-weight: 500; margin-left: 6px }
aside ul.rel .tech { display: block; color: var(--muted); font: 500 11.5px var(--mono) }
aside ul.rel .tech b { color: var(--fg-2); font-weight: 600 }
aside ul.rel .why { display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 11.5px; margin-top: 3px }
aside ul.rel .why .ic { width: 12px; height: 12px }
aside ul.rel .ev { background: none; border: 0; padding: 0; margin-left: 8px; color: var(--muted); vertical-align: -2px } aside ul.rel .ev:hover { color: var(--accent) }
aside .dirh { font: 600 11px var(--sans); color: var(--muted); margin: 12px 0 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
aside .listed { margin: 8px 0 0; font-size: 12px; color: var(--muted) } aside .listed .jump { font-weight: 500 }
aside details.ev { margin: 8px 0 } aside details.ev summary { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer }
aside details { margin: 6px 0 } aside summary { cursor: pointer; color: var(--fg-2) }
aside .note { color: var(--muted) }
aside .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 }
aside .chips button, aside form button, aside .edit button { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; color: var(--fg-2); display: inline-flex; gap: 5px; align-items: center }
aside .chips button.danger, aside .edit button.danger { color: var(--gap); border-color: var(--gap) }
aside .edit { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--rule); display: none }
body:not(.editable) #b-edit, body:not(.editable) #b-undo, body:not(.editable) #b-redo, body:not(.editable) #b-open, body:not(.editable) #b-save { display: none }
body.edit aside .edit { display: block }
aside .edit label { display: block; margin: 7px 0 2px; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
aside .edit input[type=text], aside .edit select, aside .edit textarea { width: 100%; padding: 4px 7px; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; color: var(--fg) }
aside .edit textarea { font-family: var(--mono); font-size: 11.5px; min-height: 60px }
aside .edit .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
aside .edit .pick { max-height: 180px; overflow: auto; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; font: 11.5px var(--mono) }
aside .edit .pick label { display: flex; gap: 6px; align-items: center; margin: 2px 0; text-transform: none; letter-spacing: 0; font: 11.5px var(--mono); color: var(--fg-2) }
aside .edit .hint { font-size: 11.5px; color: var(--muted) }
aside .err { color: var(--gap); font-size: 12.5px }
#drop { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 40px; text-align: center }
#drop[hidden] { display: none }
#drop .zone { border: 2px dashed var(--g-frame); border-radius: 10px; padding: 40px 48px; max-width: 60ch; background: var(--panel) }
#drop.over .zone { border-color: var(--accent); background: var(--accent-soft) }
