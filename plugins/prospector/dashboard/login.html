<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prospector — sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08080a; --surface: #101015; --surface2: #16161c; --fg: #fafafa; --muted: #a1a1ab;
      --faint: #6f6f78; --border: rgba(255,255,255,.13); --accent: #c6ff3a; --accent-ink: #0a0a0a;
      --danger: #ff5b5b; --font: "Space Grotesk", system-ui, sans-serif; --mono: "Space Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
      color: var(--fg); font-family: var(--font); padding: 24px; }
    .card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.8); }
    .brand { font-weight: 700; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
    .sub { color: var(--faint); font-size: 13px; margin: 6px 0 24px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .06em; }
    input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--fg); font-family: var(--mono); font-size: 15px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--accent-ink); font-family: var(--font); font-weight: 600; font-size: 15px; }
    button:disabled { opacity: .5; cursor: default; }
    .err { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="dot"></span> Prospector</div>
    <div class="sub">Enter the shared password to continue.</div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button id="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById("form");
    const pw = document.getElementById("pw");
    const btn = document.getElementById("btn");
    const err = document.getElementById("err");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = ""; btn.disabled = true;
      try {
        const r = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ password: pw.value }) });
        if (r.ok) { location.href = "/"; return; }
        err.textContent = r.status === 401 ? "Wrong password." : "Sign-in failed.";
      } catch { err.textContent = "Network error."; }
      btn.disabled = false; pw.select();
    });
  </script>
</body>
</html>
